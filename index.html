<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Title, description, canonical, share tags and schema.org data, per
         page. Filled at build time from src/lib/seo/pages.ts by
         scripts/seo-plugin.ts. -->
    <!--seo-head-->
    <meta name="author" content="Gabriel Catimbang" />
    <meta name="theme-color" content="#0b0b0d" />

    <!-- Favicon and Icons -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon-192.svg" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Performance and Mobile -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="GoG" />

    <!-- Additional SEO Meta Tags -->
    <meta name="format-detection" content="telephone=no" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta name="color-scheme" content="dark" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />


    <!-- Optimized font loading with reduced weights -->
    <!-- Loaded without blocking the first paint, so the loader shows at once.
         Text falls back to the system font until Poppins arrives (display=swap). -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" /></noscript>

    <!-- Critical CSS for above-the-fold content -->
    <style>
      /* CSS Variables for theming */
      :root {
        /* Season 3 palette. Keep in sync with src/index.css and DESIGN.md */
        --background: 240 8% 5%;
        --foreground: 40 20% 95%;
        --primary: 39 67% 55%;
        --primary-foreground: 30 42% 7%;
        --secondary: 240 5% 11%;
        --secondary-foreground: 40 20% 95%;
        --muted-foreground: 40 5% 64%;
        --border: 240 5% 15%;
        --input: 240 5% 18%;
        --ring: 40 80% 75%;
        --radius: 0.5rem;
      }

      /* Critical base styles */
      * {
        border-color: hsl(var(--border));
      }

      body {
        background-color: hsl(var(--background));
        color: hsl(var(--foreground));
        overflow-x: hidden;
        font-family: Poppins, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol", "Noto Color Emoji";
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      /* Font fallbacks to prevent FOIT */
      .font-display {
        font-family: Poppins, ui-sans-serif, system-ui, sans-serif;
      }

      .font-mono {
        font-family: Poppins, ui-sans-serif, system-ui, sans-serif;
      }

      /* Static page text from the build (scripts/seo-plugin.ts) for crawlers
         that don't run JavaScript. React replaces it; the boot screen covers it
         until then. */
      .seo-shell { max-width: 40rem; margin: 0 auto; padding: 3rem 1rem; line-height: 1.6; }
      .seo-shell h1 { font-size: 2rem; line-height: 1.1; margin: 0 0 1rem; }
      .seo-shell a { color: #e0b45a; }

      /* Boot screen: the Season 3 title card, shown from the first paint until the
         app has something to show. It sits outside #root, so React never replaces it;
         src/lib/boot-screen.ts fades it out. Spec: "Loader" in DESIGN.md. */
      .boot {
        --band: min(34vh, 72vw);
        --word: min(86vw, 560px, 62vh);
        position: fixed; inset: 0; z-index: 100;
        display: flex; flex-direction: column; justify-content: center;
        overflow: hidden;
        background: hsl(var(--background));
        transition: opacity 0.25s ease-out;
      }
      .boot[hidden] { display: none; }
      .boot.is-leaving { opacity: 0; pointer-events: none; }
      .boot-sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
      .boot-band { position: relative; flex: none; height: var(--band); }
      .boot-arm {
        --tip: calc(var(--band) * 0.36);
        position: absolute; top: 0; bottom: 0; width: 50%;
        background-image:
          radial-gradient(rgb(0 0 0 / 0.2) 0.9px, transparent 1.4px),
          linear-gradient(var(--shade), transparent 55%, rgb(0 0 0 / 0.25));
        background-size: 5px 5px, 100% 100%;
      }
      .boot-blue {
        left: 0; background-color: #3b82f6; --shade: rgb(127 176 255 / 0.25);
        clip-path: polygon(0 0, calc(100% - var(--tip)) 0, 100% 50%, calc(100% - var(--tip)) 100%, 0 100%, var(--tip) 50%);
        animation: boot-blue-in 0.55s cubic-bezier(0.16, 1, 0.3, 1) both, boot-blue-push 1.8s cubic-bezier(0.7, 0, 0.2, 1) 0.55s infinite;
      }
      .boot-red {
        right: 0; background-color: #ef4b40; --shade: rgb(255 154 143 / 0.25);
        clip-path: polygon(var(--tip) 0, 100% 0, calc(100% - var(--tip)) 50%, 100% 100%, var(--tip) 100%, 0 50%);
        animation: boot-red-in 0.55s cubic-bezier(0.16, 1, 0.3, 1) both, boot-red-push 1.8s cubic-bezier(0.7, 0, 0.2, 1) 0.55s infinite;
      }
      .boot-flash {
        position: absolute; left: 50%; top: -6%; width: 3px; height: 112%; margin-left: -1.5px;
        background: #f7e3b5; box-shadow: 0 0 28px 6px rgb(243 210 138 / 0.55);
        animation: boot-flash-in 0.7s ease-out 0.38s both, boot-flash 1.8s ease-out 0.55s infinite;
      }
      .boot-sticker {
        position: absolute; top: calc(var(--word) * -0.05); right: max(5vw, calc(50vw - var(--word) / 2));
        display: block; box-sizing: content-box; width: calc(var(--word) * 0.24); height: auto;
        padding: calc(var(--word) * 0.026) calc(var(--word) * 0.034);
        border: 2px solid #17110a; border-radius: 6px; background: #d9a441; color: #17110a;
        transform: rotate(-7deg);
        animation: boot-sticker 0.45s cubic-bezier(0.34, 1.4, 0.5, 1) 0.7s both;
      }
      .boot-type {
        width: var(--word); margin: calc(var(--word) * 0.07) auto 0;
        color: #f3ead8;
        animation: boot-type-in 0.5s cubic-bezier(0.16, 1, 0.3, 1) 0.3s both;
      }
      .boot-type svg { display: block; height: auto; }
      .boot-small { width: calc(var(--word) * 0.42); margin: 0 0 calc(var(--word) * 0.035) 0.5%; opacity: 0.85; }
      .boot-word { width: 100%; }
      @keyframes boot-blue-in { from { transform: translateX(-100%); } 80% { transform: translateX(2%); } to { transform: none; } }
      @keyframes boot-red-in { from { transform: translateX(100%); } 80% { transform: translateX(-2%); } to { transform: none; } }
      @keyframes boot-blue-push { 0%, 20% { transform: none; } 62% { transform: translateX(calc(var(--band) * -0.07)); } 74% { transform: translateX(calc(var(--band) * 0.012)); } 82%, 100% { transform: none; } }
      @keyframes boot-red-push { 0%, 20% { transform: none; } 62% { transform: translateX(calc(var(--band) * 0.07)); } 74% { transform: translateX(calc(var(--band) * -0.012)); } 82%, 100% { transform: none; } }
      @keyframes boot-flash-in { from { opacity: 0; transform: scaleY(0.2); } 15% { opacity: 1; transform: none; } to { opacity: 0; } }
      @keyframes boot-flash { 0%, 72% { opacity: 0; transform: scaleY(0.3); } 76% { opacity: 1; transform: none; } 100% { opacity: 0; } }
      @keyframes boot-type-in { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
      @keyframes boot-sticker { from { opacity: 0; transform: scale(1.7) rotate(-18deg); } to { opacity: 1; transform: rotate(-7deg); } }
      @media (prefers-reduced-motion: reduce) {
        .boot-blue, .boot-red, .boot-flash, .boot-sticker, .boot-type { animation: none; }
        .boot-flash { opacity: 0; }
      }
    </style>
    <!-- Without JavaScript the app can't start, so show the page text instead
         of a title card that never leaves. -->
    <noscript><style>.boot { display: none; }</style></noscript>

    <!-- Performance Resource Hints - Prioritized for LCP -->
    <!-- DNS prefetch for external domains -->
    <link rel="dns-prefetch" href="//fonts.googleapis.com" />
    <link rel="dns-prefetch" href="//fonts.gstatic.com" />
    <link rel="dns-prefetch" href="//vitals.vercel.com" />
    <link rel="dns-prefetch" href="//vitals.vercel-insights.com" />
