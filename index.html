      /* CSS Variables for theming */
      :root {

        --background: 240 8% 5%;

      body {

        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      /* Font fallbacks to prevent FOIT */
      .font-display {
        font-family: Poppins, ui-sans-serif, system-ui, sans-serif;
      }

      .font-mono {
        font-family: Poppins, ui-sans-serif, system-ui, sans-serif;

      /* First-paint loader. Keep in sync with src/components/LoadingSpinner.tsx */
      .boot { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; background: hsl(var(--background)); }
      .boot-mark { overflow: visible; }
      .boot-name { margin: 0; font-size: 14px; font-weight: 600; color: hsl(var(--foreground) / 0.8); }
      .boot-sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
      .boot-blue, .boot-red, .boot-flash { animation: 1.6s cubic-bezier(0.16, 1, 0.3, 1) infinite; }
      .boot-blue { animation-name: boot-blue; }
      .boot-red { animation-name: boot-red; }
      .boot-flash { transform-origin: 24px 12px; transform-box: view-box; animation-name: boot-flash; }
      @keyframes boot-blue { 0% { transform: translateX(-9px); opacity: 0; } 38%, 62% { transform: none; opacity: 1; } 100% { transform: translateX(-9px); opacity: 0; } }
      @keyframes boot-red { 0% { transform: translateX(9px); opacity: 0; } 38%, 62% { transform: none; opacity: 1; } 100% { transform: translateX(9px); opacity: 0; } }
      @keyframes boot-flash { 0%, 36% { opacity: 0; transform: scaleY(0.2); } 42% { opacity: 1; transform: none; } 70%, 100% { opacity: 0; transform: none; } }
      @media (prefers-reduced-motion: reduce) {
        .boot-blue, .boot-red, .boot-flash { animation: none; }
        .boot-flash { opacity: 0.9; }
      }
    </style>
